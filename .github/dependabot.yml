version: 2

# Política de versiones (desde el 09-11-2026): las dependencias se quedan en una versión FIJA y segura.
# - Nada se actualiza solo por ser más nuevo: open-pull-requests-limit: 0 apaga las PR de versión de Dependabot.
# - Solo se actualiza cuando hace falta: una vulnerabilidad (alerta de Dependabot, NuGetAudit en el build,
#   npm audit, dependency-review o Trivy en el CI) o una función que la necesite. Se hace a mano, en una rama
#   de trabajo con PR a develop, subiendo a la versión parcheada más cercana.
# - Las alertas de seguridad de Dependabot siguen activas (Settings › Code security): avisan sin abrir PR.
# Se mantiene cada ecosistema listado para que Dependabot conozca los manifiestos y las carpetas.
updates:
  - package-ecosystem: nuget
    # La raíz no tiene .csproj (la solución es .slnx), así que se listan las carpetas de proyectos.
    directories:
      - "/Host/*"
      - "/Modules/*/*"
      - "/tests/*"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
