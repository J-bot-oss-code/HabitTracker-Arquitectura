# HabitTracker Nexus - composición completa: la API y su base de datos.
#
#   copy .env.example .env        (Windows)   |   cp .env.example .env   (Linux / macOS)
#   docker compose up --build
#
# Este archivo NO contiene valores secretos: solo referencias ${VARIABLE} que Docker Compose
# toma del archivo .env, que no se versiona (RD-10).

services:
  # --------------------------------------------------------------------------
  # Base de datos. No tiene "ports": no es accesible desde fuera de la composición.
  # La aplicación la encuentra por su NOMBRE de servicio ("db"), no por localhost.
  # --------------------------------------------------------------------------
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    volumes:
      # Volumen con nombre para los datos de SQL Server (RD-09), distinto al de los documentos.
      - sqlserver-datos:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --------------------------------------------------------------------------
  # La aplicación. Es el ÚNICO servicio que publica un puerto en el equipo.
  # --------------------------------------------------------------------------
  webapi:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # "Server=db": el nombre del servicio de arriba.
      ConnectionStrings__AccessControl: "Server=db;Database=HabitTracker;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      JwtSettings__Clave: ${JWT_CLAVE:?Define JWT_CLAVE en el archivo .env}

      # Arranque sin pasos manuales: migra la base y crea el Administrador y la Meta de demostración.
      BaseDeDatos__MigrarAlIniciar: "true"
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-}

      # Los archivos de los documentos se guardan en el volumen montado más abajo.
      Documentos__RutaAlmacenamiento: /app/data/documentos

      # Claves de Data Protection que cifran el cuestionario de salud. Si se pierden, esos datos no se pueden leer:
      # van en su propio volumen. Respáldalas APARTE de la base de datos: un respaldo con las dos juntas anula el cifrado.
      DATAPROTECTION_KEYS_PATH: /app/data/claves

      CORREO_MODO: ${CORREO_MODO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}

      App__BaseUrl: ${APP_BASE_URL:-http://localhost:8080}
      # Rechaza contraseñas que aparecen en filtraciones conocidas (consulta a Pwned Passwords con k-anonimato). false = solo formato.
      Seguridad__ContrasenasFiltradas__Habilitado: ${CONTRASENAS_FILTRADAS:-true}
      # Origen del frontend que puede llamar a la API desde el navegador (CORS). Sin comodines: un solo origen exacto.
      Cors__OrigenesPermitidos__0: ${FRONTEND_URL:-http://localhost:5173}
      # ID de cliente de Google (público por diseño, no es un secreto). Vacío = el inicio con Google responde 503.
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      # Baja de cuenta: días de gracia antes de borrar la cuenta y cada cuántos minutos se buscan cuentas vencidas.
      Privacidad__DiasGraciaBaja: ${DIAS_GRACIA_BAJA:-30}
      Privacidad__IntervaloEjecucionMinutos: ${BAJAS_INTERVALO_MINUTOS:-1440}
      Swagger__Habilitado: ${SWAGGER_HABILITADO:-false}
      # El contenedor solo escucha HTTP: no hay a dónde redirigir.
      Https__RedireccionDesactivada: "true"
    volumes:
      # Volumen con nombre para los archivos de documentos, FUERA de la imagen (RF-DOC-05).
      - documentos-archivos:/app/data/documentos
      # Claves de cifrado de los datos de salud, fuera de la imagen (RD-09).
      - dataprotection-claves:/app/data/claves

volumes:
  sqlserver-datos:
  documentos-archivos:
  dataprotection-claves:
